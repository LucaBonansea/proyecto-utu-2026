<!DOCTYPE html>

<body>

            <div class="logo-div">

        <button class="noti">
            
           <span class="material-symbols-outlined">

    <main id="main">
        

    </main>

        <button class="new-reclamo">

        <button class="notificaciones-btn">
            <span class="material-symbols-outlined">notifications</span>

        <button class="user-btn" >
