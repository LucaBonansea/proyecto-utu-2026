<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reclamos</title>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
    >

    <link
        rel="stylesheet"
        href="/proyecto-utu-2026/src/frontend/css/style-proveedores.css"
    >
</head>

<body>

    <header>

        <div class="logos">

            <div class="logo-div">
                <img
                    class="logo"
                    src="/proyecto-utu-2026/src/frontend/assets/imgs/logo_reclamos.png"
                    alt=""
                >
            </div>

            <div class="int-logo-div">
                <img
                    class="int-logo"
                    src="/proyecto-utu-2026/src/frontend/assets/imgs/logo_intendencia.png"
                    alt=""
                >
            </div>

        </div>

        <div class="header-actions">

            <button
                type="button"
                id="btn-cuenta"
                class="header-action"
            >
                <span class="material-symbols-outlined">
                    account_circle
                </span>

                <span>Mi cuenta</span>
            </button>

            <button
                type="button"
                id="btn-logout"
                class="header-action"
            >
                <span class="material-symbols-outlined">
                    logout
                </span>

                <span>Cerrar sesión</span>
            </button>

        </div>

    </header>


    <main>

        <section id="resumen-urgentes" class="urgentes-section">

            <div class="urgentes-header">

                <div class="urgentes-titulo">

                    <span class="material-symbols-outlined">
                        priority_high
                    </span>

                    <div>
                        <h2>Reclamos urgentes</h2>
                        <p id="cantidad-urgentes">
                            0 reclamos requieren atención prioritaria
                        </p>
                    </div>

                </div>

            </div>

            <div
                id="container-urgentes"
                class="container-urgentes"
            ></div>

        </section>


        <section id="lista-reclamos">

            <div class="filtros-reclamos">

                <button
                    type="button"
                    class="filtro-activo"
                    data-filtro="todos"
                >
                    Todos
                </button>

                <button
                    type="button"
                    data-filtro="pendientes"
                >
                    Pendientes
                </button>

                <button
                    type="button"
                    data-filtro="en_proceso"
                >
                    En proceso
                </button>

            </div>

            <div
                id="container-reclamos"
                class="container-reclamos"
            ></div>

        </section>


        <section
            id="detalle-reclamo"
            class="oculto"
        >

            <button
                id="btn-volver"
                class="btn-volver"
            >
                <span class="material-symbols-outlined">
                    arrow_back
                </span>

                Volver
            </button>

            <div class="detalle-card">

                <div class="detalle-imagen-container">

                    <img
                        id="detalle-imagen"
                        src=""
                        alt="Evidencia del reclamo"
                    >

                </div>


                <div class="detalle-contenido">

                    <div class="detalle-header">

                        <div>

                            <h2 id="detalle-titulo"></h2>

                            <span id="detalle-prioridad"></span>

                        </div>

                        <span id="detalle-estado"></span>

                    </div>


                    <p id="detalle-fecha"></p>


                    <div class="detalle-descripcion">

                        <h3>Descripción</h3>

                        <p id="detalle-descripcion"></p>

                    </div>


                    <div class="detalle-info">

                        <div>

                            <strong>Edificio</strong>

                            <p id="detalle-edificio"></p>

                        </div>

                        <div>

                            <strong>Dirección</strong>

                            <p id="detalle-direccion"></p>

                        </div>

                        <div>

                            <strong>Clasificación</strong>

                            <p id="detalle-clasificacion"></p>

                        </div>

                    </div>


                    <div
                        id="aceptar-container"
                    >

                        <button
                            id="btn-aceptar"
                            class="btn-aceptar"
                        >
                            Aceptar reclamo
                        </button>

                    </div>


                    <form
                        id="form-resolver"
                        class="oculto"
                    >

                        <h3>Finalizar reclamo</h3>


                        <div class="campo">

                            <label for="foto-resolucion">
                                Foto de resolución
                            </label>

                            <input
                                type="file"
                                id="foto-resolucion"
                                accept="image/*"
                            >

                        </div>


                        <div
                            id="preview-container"
                            class="oculto"
                        >

                            <img
                                id="preview-resolucion"
                                src=""
                                alt="Vista previa"
                            >

                        </div>


                        <div class="campo">

                            <label for="observaciones">
                                Observaciones
                            </label>

                            <textarea
                                id="observaciones"
                                maxlength="500"
                                placeholder="Describe el trabajo realizado..."
                            ></textarea>

                        </div>


                        <button
                            id="btn-finalizar"
                            class="btn-finalizar"
                            type="submit"
                        >
                            Finalizar reclamo
                        </button>

                    </form>

                </div>

            </div>

        </section>
        <section id="cuenta-panel" class="oculto">

    <button id="btn-volver-cuenta" class="btn-volver">
        ← Volver
    </button>

    <div class="cuenta-card">

        <div class="cuenta-header">
            <div class="cuenta-icono">
                <span class="material-symbols-outlined">
                    person
                </span>
            </div>

            <div>
                <h2>Mi cuenta</h2>
                <p>Información de tu cuenta</p>
            </div>
        </div>

        <div id="cuenta-mensaje" class="cuenta-mensaje oculto"></div>

        <div class="cuenta-datos">

            <div class="cuenta-dato">
                <span>Nombre</span>
                <strong id="cuenta-nombre">-</strong>
            </div>

            <div class="cuenta-dato">
                <span>Cédula</span>
                <strong id="cuenta-cedula">-</strong>
            </div>

            <div class="cuenta-dato">
                <span>Correo electrónico</span>
                <strong id="cuenta-email">-</strong>
            </div>

            <div class="cuenta-dato">
                <span>Teléfono</span>
                <strong id="cuenta-telefono">-</strong>
            </div>

            <div class="cuenta-dato">
                <span>Proveedor</span>
                <strong id="cuenta-proveedor">-</strong>
            </div>

            <div class="cuenta-dato">
                <span>Rol</span>
                <strong id="cuenta-rol">Usuario proveedor</strong>
            </div>

        </div>

    </div>

</section>

<div id="mensaje-pagina" class="mensaje-pagina oculto"></div>

    </main>


    <script
        type="module"
        src="/proyecto-utu-2026/src/frontend/js/DOM/proveedores.js"
    ></script>

</body>
</html>
