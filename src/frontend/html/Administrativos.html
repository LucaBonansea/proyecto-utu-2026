<!--
    VISTA: Bandeja de trabajo del rol administrativo.
    Esta plantilla aporta el encabezado, el listado y el modal de detalle.
    El archivo administrativos.js consulta los reclamos pendientes y los
    presenta para que el administrativo los revise y asigne a un proveedor.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrativo Departamental</title>
    <link rel="stylesheet" href="/proyecto-utu-2026/src/frontend/css/style-administrativos.css?v=20261016-2">
    <link rel="stylesheet" href="/proyecto-utu-2026/src/frontend/css/ui-common.css?v=20261016-2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    
</head>
<body class="administrativo-page" data-carga-interfaz>
   
    <!-- Ventana emergente que JS rellena al abrir un reclamo. -->
    <div id="modal-reclamo" class="modal-reclamo">

        <div class="fondo-modal"></div>

        <div class="card-detalle-modal">

            <button class="cerrar-modal">
                ×
            </button>

            <div id="contenido-modal"></div>

        </div>

    </div>

    <main>
        <header>
            <a
                class="logos"
                href="./Administrativos.html"
                aria-label="Ir al inicio de administrativo"
                title="Inicio"
            >
                <div class="logo-div">
                    <img class="logo" src="/proyecto-utu-2026/src/frontend/assets/imgs/logo_reclamos.png" alt="">
                </div>
                <div class="int-logo-div">
                    <img class="int-logo" src="/proyecto-utu-2026/src/frontend/assets/imgs/logo_intendencia.png" alt="">
                </div>
            </a>

            <div class="header-title">
                <h1>Administrativo Departamental</h1>
            </div>

            <div class="header-actions">
                <button
                    class="theme-toggle"
                    id="theme-toggle"
                    type="button"
                    aria-label="Cambiar tema"
                >
                    <span class="material-symbols-outlined">contrast</span>
                </button>
                <button
                    class="notificaciones-btn-top"
                    type="button"
                    aria-label="Notificaciones"
                    aria-controls="menu-top-notificaciones"
                    aria-expanded="false"
                    title="Notificaciones"
                >
                    <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
                </button>
                <button
                    class="header-logout logout"
                    type="button"
                    aria-label="Cerrar sesión"
                    title="Cerrar sesión"
                >
                    <span class="material-symbols-outlined" aria-hidden="true">logout</span>
                </button>
            </div>

            <section
                class="menu-top-notificaciones"
                id="menu-top-notificaciones"
                role="region"
                aria-labelledby="titulo-notificaciones"
            >
                <div class="div-inicial">
                    <h2 id="titulo-notificaciones">Notificaciones</h2>
                </div>
                <section class="notificaciones-lista" aria-label="Lista de notificaciones" aria-live="polite"></section>
            </section>
        </header>

        <!-- El controlador inserta filtros/listado dentro de estos espacios. -->
        <div id="filtro-container"></div>

        <section></section>
    </main>

    <script src="https://unpkg.com/nextjs-toast-notify@1.62.0/dist/nextjs-toast-notify.min.js"></script>
    <!-- Carga compartida y lógica específica de revisión de reclamos. -->
    <script src="/proyecto-utu-2026/src/frontend/js/global-loading.js?v=20261022-2"></script>
    <script src="/proyecto-utu-2026/src/frontend/js/DOM/administrativos.js?v=20261022-2" type="module"></script>
</body>
</html>
