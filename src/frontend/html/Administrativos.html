<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrativos - Reclamos</title>
    <link rel="stylesheet" href="/proyecto-utu-2026/src/frontend/css/style-administrativos.css">
    <link rel="stylesheet" href="/proyecto-utu-2026/src/frontend/css/ui-common.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    
</head>
<body>
   
    <div id="modal-reclamo" class="modal-reclamo">

        <div class="fondo-modal"></div>

        <div class="card-detalle-modal">

            <button class="cerrar-modal">
                ×
            </button>

            <div id="contenido-modal"></div>

        </div>

    </div>

    <aside class="sidebar">
        <div class="first-btns">
            <button class="sidebar-btn all-reclamos active">
                <span class="material-symbols-outlined">assignment</span>
                Reclamos a validar
            </button>
        </div>
        <div class="last-btns">
            <button type="button" class="sidebar-btn logout">
                <span class="material-symbols-outlined">logout</span>
                Cerrar sesión
            </button>
        </div>
    </aside>

    <main>
        <header>
            <div class="logos">
                <div class="logo-div">
                    <img class="logo" src="/proyecto-utu-2026/src/frontend/assets/imgs/logo_reclamos.png" alt="">
                </div>
                <a href="index.html" class="int-logo-div">
                    <img class="int-logo" src="/proyecto-utu-2026/src/frontend/assets/imgs/logo_intendencia.png" alt="">
                </a>
            </div>

            <div class="header-actions">
                <button
                    class="theme-toggle"
                    id="theme-toggle"
                    type="button"
                    aria-label="Cambiar tema"
                >
                    <span class="material-symbols-outlined">contrast</span>
                </button>
                <button
                    class="notificaciones-btn-top"
                    type="button"
                    aria-label="Notificaciones"
                    aria-controls="menu-top-notificaciones"
                    aria-expanded="false"
                    title="Notificaciones"
                >
                    <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
                </button>
            </div>

            <section
                class="menu-top-notificaciones"
                id="menu-top-notificaciones"
                role="region"
                aria-labelledby="titulo-notificaciones"
            >
                <div class="div-inicial">
                    <h2 id="titulo-notificaciones">Notificaciones</h2>
                </div>
                <section class="notificaciones-lista" aria-label="Lista de notificaciones" aria-live="polite"></section>
            </section>
        </header>

        <div id="filtro-container"></div>

        <section></section>
    </main>

    <script src="https://unpkg.com/nextjs-toast-notify@1.62.0/dist/nextjs-toast-notify.min.js"></script>
    <script src="/proyecto-utu-2026/src/frontend/js/DOM/administrativos.js" type="module"></script>
</body>
</html>
