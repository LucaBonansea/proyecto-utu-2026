<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>Portal Ciudadano</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/proyecto-utu-2026/src/frontend/css/style.css">
        <link rel="icon" href="/proyecto-utu-2026/src/frontend/assets/imgs/logo_reclamos.png">
    </head>

    <body>
        <header>
            <a href="index.html" class="logos">
                <div class="logo-div">
                    <img class="logo" src="/proyecto-utu-2026/src/frontend/assets/imgs/intendencia-logo-inicio.png" alt="">
                </div>
                <div class="int-logo-div">
                    <img class="int-logo" src="/proyecto-utu-2026/src/frontend/assets/imgs/logo_intendencia.png" alt="">
                </div>
            </a>
        </header>

        <main>
            <div class="titulos">
                <h2>Iniciar sesión - Ciudadano</h2>
                <p class="subtitulo">
                    Ingresa tu número de teléfono y pin.
                </p>
            </div>

            <section class="div-login">
            <section class="login-div">

                <div class="div-tel">
                    <p>Número telefónico</p>
                    <input class="tel-input" type="text" name="" id="" placeholder="098784392"  inputmode="numeric" pattern="[0-9]*" autocomplete="current-password">
                </div>
                

                <div class="div-pass">
                    <p style="font-size:13px;">PIN</p>
                    <input class="pass-input" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password">
                    <div class="olv-div">
                        <a class="olvidaste" href="">¿Olvidaste tu Pin?</a>
                    </div>
                </div>
                
                
                    </section>
            </section>

            <div class="div-login-btn">
                <button class="btn-login">Iniciar sesión</button>
            </div>












        </main>




        <script src="https://unpkg.com/nextjs-toast-notify@1.47.0/dist/nextjs-toast-notify.js"></script>
        <script src="/proyecto-utu-2026/src/frontend/js/script.js" type="text/javascript"></script>

    </body>
</html>
