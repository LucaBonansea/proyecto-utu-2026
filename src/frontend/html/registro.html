<!DOCTYPE html>
<html lang="en">
 <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>Portal Ciudadano</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/proyecto-utu-2026/src/frontend/css/style-registro.css">
        <link rel="icon" href="/proyecto-utu-2026/src/frontend/assets/imgs/logo_reclamos.png">
    </head>
<body>
    <header>
            <a href="index.html" class="logos">
                <div class="logo-div">
                    <img class="logo" src="/proyecto-utu-2026/src/frontend/assets/imgs/intendencia-logo-inicio.png" alt="">
                </div>
                <div class="int-logo-div">
                    <img class="int-logo" src="/proyecto-utu-2026/src/frontend/assets/imgs/logo_intendencia.png" alt="">
                </div>
            </a>
        </header>

        <main>
            <div class="titulos">
                <h2>Registro</h2>
                <p class="subtitulo">
                   Registra tu número de teléfono y contraseña.
                </p>
            </div>

            <section class="div-login">
            <section class="login-div">

                <div class="div-tel">
                    <p>Nombre</p>
                    <input class="name-input" type="text" name="" id="" placeholder="John Doe"  inputmode="text" autocomplete="current-password" required>
                </div>

                <div class="div-tel">
                    <p>Cédula</p>
                    <input class="ci-input" type="text" name="" id="" placeholder="12345678"  inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" required>
                </div>
                <div class="div-tel">
                <p>Edificio</p>
                <select class="edificio-select" required>
                <option value="" selected disabled>Selecciona tu edificio</option>
                <option value="1">Edificio Administrativo</option>
                <option value="2">Edificio Ejecutivo</option>
                <option value="3">Edificio Residencial</option>
                 </select>
                 </div>

                 <div class="div-pass">
                 <p style="font-size:13px;">Contraseña</p>
                 <input class="pass-input"
                  placeholder="Contraseña"
                 type="password"
                 autocomplete="new-password"
                 required>

                 <p style="font-size:13px;">Repetir contraseña</p>
                 <input class="pass-input-2"
                  placeholder="Repetir contraseña"
                 type="password"
                 autocomplete="new-password"
                required>
                </div>
                
                    </section>
            </section>

            <div class="div-login-btn">
                <button class="btn-registro">Registrar</button>
            </div>












        </main>
        
        <script src="https://unpkg.com/nextjs-toast-notify@1.47.0/dist/nextjs-toast-notify.js"></script>
        <script src="/proyecto-utu-2026/src/frontend/js/script-registro.js"></script>
</body>
</html>
