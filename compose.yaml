services:

  backend:
    build:
      context: ./src/backend

    ports:
      - "8000:8000"

    volumes:
      - ./src/backend:/var/www/html

    depends_on:
      - database

  database:
    image: mysql:8.0

    environment:
      MYSQL_DATABASE: proyecto_utu
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: