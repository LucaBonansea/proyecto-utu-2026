services:

  frontend-beta:
    build:
      context: .
      dockerfile: ./src/frontend/Dockerfile

    ports:
      - "5501:80"

    depends_on:
      - backend

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./src/backend

    volumes:
      - backend_storage:/var/www/html/storage/app/public

    environment:
      APP_ENV: local
      APP_KEY: base64:yx31sN/m5zhk/IoHU1C7eh6MuKTlkuzBiAs6YKgOFtg=
      APP_DEBUG: "true"
      APP_URL: http://localhost:5501
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: proyecto_utu
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: database
      SESSION_COOKIE: proyecto_utu_session
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:5500,localhost:5500,127.0.0.1:5501,localhost:5501,10.244.237.220:5501,192.168.*:5501,10.*:5501,172.*:5501

    ports:
      - "8000:8000"

    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0

    environment:
      MYSQL_DATABASE: proyecto_utu
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
  backend_storage:
